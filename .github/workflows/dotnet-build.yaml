name: dotnet-build

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 10.0.x
      target:
        type: string
        required: false
        default: .
      working-directory:
        type: string
        required: false
        default: .
      configuration:
        type: string
        required: false
        default: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        working-directory: ${{ inputs.working-directory }}
        run: dotnet restore "${{ inputs.target }}"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: dotnet build "${{ inputs.target }}" --configuration "${{ inputs.configuration }}" --no-restore
