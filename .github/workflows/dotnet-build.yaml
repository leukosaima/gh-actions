name: dotnet-build

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 10.0.x
      target:
        type: string
        required: false
        default: .
      working-directory:
        type: string
        required: false
        default: .
      configuration:
        type: string
        required: false
        default: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        working-directory: ${{ inputs.working-directory }}
        run: dotnet restore "${{ inputs.target }}"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: dotnet build "${{ inputs.target }}" --configuration "${{ inputs.configuration }}" --no-restore
